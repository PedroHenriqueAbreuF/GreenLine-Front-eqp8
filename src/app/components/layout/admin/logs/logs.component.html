<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Operação</th>
      <th>Data</th>
      <th>Usuário</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let log of auditLogs">
      <td>{{ log.id }}</td>
      <td>{{ log.operation }}</td>
      <td>{{ log.createdBy }}</td> 
    </tr>
  </tbody>
</table>
